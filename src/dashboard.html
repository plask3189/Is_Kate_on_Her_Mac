<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Kate on Her Mac</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
        <polyline points="4,18 8,10 12,14 16,6 20,12"/>
      </svg>
    </div>
    <span class="topbar-title">Is Kate on Her Mac</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-file" id="fileLabel">connecting...</span>
    <div class="topbar-status">
      <div class="live-dot"></div>
      <span>Live</span>
    </div>
  </div>
</div>

<div class="main" id="app">
  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading activity data...</p>
  </div>
</div>
<script src="dashboard.js"></script>

</body>
</html>
