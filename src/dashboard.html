<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Kate on her Mac</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #111111;
    --surface-3: #1a1a1a;
    --border: #1e1e1e;
    --border-hover: #2a2a2a;
    --green: #00C805;
    --text: #ffffff;
    --text-2: #c9c9c9;
    --text-3: #737373;
    --text-4: #404040;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-logo {
    width: 28px; height: 28px;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .topbar-logo svg { width: 14px; height: 14px; }

  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }

  .topbar-right { display: flex; align-items: center; gap: 20px; }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse-dot 2s ease infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,200,5,0.4); }
    50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(0,200,5,0); }
  }

  .topbar-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-3);
    font-family: 'DM Mono', monospace;
  }

  .topbar-file {
    font-size: 12px; color: var(--text-4);
    font-family: 'DM Mono', monospace;
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 32px 80px;
  }

  .hero {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
  }

  .hero-label { font-size: 13px; color: var(--text-3); margin-bottom: 8px; font-weight: 500; }

  .hero-value {
    font-size: 30px; font-weight: 700;
    letter-spacing: -2px; line-height: 1;
    margin-bottom: 8px;
  }

  .hero-sub { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .hero-sub .green { color: var(--green); }
  .hero-sub .dim { color: var(--text-3); }

  .section { margin-bottom: 32px; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }

  .section-title { font-size: 15px; font-weight: 600; color: var(--text-2); }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.2s ease;
  }

  .chart-card:hover { border-color: var(--border-hover); }

  .heatmap-container { overflow-x: auto; }

  .heatmap-grid {
    display: grid;
    grid-template-columns: 90px repeat(24, 1fr);
    gap: 2px;
    min-width: 600px;
  }

  .hm-header {
    font-family: 'DM Mono', monospace; font-size: 9px;
    color: var(--text-4); text-align: center; padding-bottom: 6px;
  }

  .hm-label {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-3);
    display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
  }

  .hm-cell {
    height: 14px;
    border-radius: 3px;
    background: var(--surface-2); min-height: 18px;
    cursor: default; transition: transform 0.12s ease;
    position: relative;
  }

  .hm-cell:hover { transform: scale(1.35); z-index: 5; }

  .hm-cell[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    background: var(--surface-3); border: 1px solid var(--border);
    color: var(--text); padding: 5px 10px; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 10px;
    white-space: nowrap; z-index: 20; pointer-events: none;
  }

  .loading-state { text-align: center; padding: 120px 20px; }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--surface-3);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p { color: var(--text-3); font-size: 14px; }
  .error-msg { color: var(--red); font-size: 13px; text-align: center; padding: 40px; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim { animation: fadeIn 0.35s ease both; }

  @media (max-width: 700px) {
    .hero-value { font-size: 40px; }
    .main { padding: 24px 16px 60px; }
    .topbar { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
        <polyline points="4,18 8,10 12,14 16,6 20,12"/>
      </svg>
    </div>
    <span class="topbar-title">Is Kate on her Mac</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-file" id="fileLabel">connecting...</span>
    <div class="topbar-status">
      <div class="live-dot"></div>
      <span>Live</span>
    </div>
  </div>
</div>

<div class="main" id="app">
  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading activity data...</p>
  </div>
</div>

<script>
const API_BASE = "";
let pollInterval = null;

async function fetchData() {
  try {
    const res = await fetch(API_BASE + '/api/data');
    if (!res.ok) throw new Error('No data');
    return await res.json();
  } catch { return null; }
}

async function init() {
  const payload = await fetchData();
  const app = document.getElementById('app');

  if (!payload || !payload.entries.length) {
    app.innerHTML = '<div class="loading-state"><p class="error-msg">No activity data found. Start the tracker and check back.</p></div>';
    document.getElementById('fileLabel').textContent = 'no data';
    setTimeout(init, 10000);
    return;
  }

  document.getElementById('fileLabel').textContent = payload.filename;
  render(payload.entries);

  if (!pollInterval) {
    pollInterval = setInterval(async () => {
      const fresh = await fetchData();
      if (fresh && fresh.entries.length) {
        document.getElementById('fileLabel').textContent = fresh.filename;
        render(fresh.entries);
      }
    }, 30000);
  }
}

function render(raw) {
  const data = raw.map(d => ({ ...d, _t: new Date(d.timestamp) })).sort((a, b) => a._t - b._t);
  let totC = 0, totK = 0, totM = 0;
  for (const d of data) { totC += d.left_clicks; totK += d.keypresses; totM += d.mouse_movements; }
  const totAll = totC + totK + totM;

  const spanMin = Math.max(1, Math.round((data[data.length-1]._t - data[0]._t) / 60000));
  const spanLbl = spanMin >= 60 ? (spanMin/60).toFixed(1)+'h' : spanMin+'min';

  document.getElementById('app').innerHTML = `
    <div class="hero anim">
      <div class="hero-label">Total Events Tracked</div>
      <div class="hero-value">${totAll.toLocaleString()}</div>
      <div class="hero-sub">
        <span class="green">${(totAll/spanMin).toFixed(0)} events/min</span>
        <span class="dim">over ${spanLbl}</span>
      </div>
    </div>
    <div class="section anim" style="animation-delay:0.24s">
      <div class="section-header"><span class="section-title">Hourly Heatmap</span></div>
      <div class="chart-card"><div class="heatmap-container"><div class="heatmap-grid" id="heatmap"></div></div></div>
    </div>`;

  buildHeatmap(data);
}

function buildHeatmap(data) {
  const el = document.getElementById('heatmap');
  const map = {};
  const daySet = new Set();

  data.forEach(d => {
    const dk = d._t.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
    //console.log(dk);
    const h = d._t.getHours();
    map[dk+'|'+h] = (map[dk+'|'+h]||0) + d.left_clicks + d.keypresses + d.mouse_movements;
    daySet.add(dk);
  });

  const days = [...daySet];
  const mx = Math.max(1, ...Object.values(map));

  const frag = document.createDocumentFragment();
  frag.appendChild(document.createElement('div'));
  for (let h = 0; h < 24; h++) {
    const hd = document.createElement('div');
    hd.className = 'hm-header';
    hd.textContent = String(h).padStart(2, '0');
    frag.appendChild(hd);
  }

  days.forEach(day => {
    const lb = document.createElement('div');
    lb.className = 'hm-label'; lb.textContent = day;
    frag.appendChild(lb);
    for (let h = 0; h < 24; h++) {
      const v = map[day+'|'+h] || 0;
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      cell.setAttribute('data-tip', `${day} ${h}:00 — ${v} events`);
      if (v > 0) {
        const intensity = v / mx;
        cell.style.backgroundColor = `rgba(0,200,5,${0.1+intensity*0.8})`;
        if (intensity > 0.7) cell.style.boxShadow = `0 0 6px rgba(0,200,5,${intensity*0.3})`;
      }
      frag.appendChild(cell);
    }
  });

  el.appendChild(frag);
}

init();
</script>
</body>
</html>
